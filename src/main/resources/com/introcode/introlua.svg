<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Degradado principal (Estilo Lua + Compilador moderno) -->
    <linearGradient id="luaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005577" />
      <stop offset="50%" stop-color="#000080" />
      <stop offset="100%" stop-color="#1a0033" />
    </linearGradient>

    <!-- Degradado del satélite / elemento activo -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo circular oscuro -->
  <rect width="512" height="512" rx="110" fill="url(#luaGrad)" />

  <!-- Luna estilizada en forma de C (Compiler/Code) -->
  <path d="M 270 100 A 140 140 0 1 0 410 240 A 170 170 0 1 1 270 100 Z" fill="#ffffff" opacity="0.95" />

  <!-- Símbolos del compilador < /> incrustados en la luna -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Símbolo < -->
    <path d="M 210 200 L 150 256 L 210 312" />
    <!-- Símbolo / -->
    <path d="M 245 320 L 275 192" />
    <!-- Símbolo > -->
    <path d="M 310 200 L 370 256 L 310 312" />
  </g>

  <!-- Satélite Lua brillante (órbita superior derecha) -->
  <circle cx="390" cy="130" r="32" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="390" cy="130" r="14" fill="#ffffff" />
</svg>